---
pacotes_base:
  - apt-transport-https
  - ca-certificates
  - curl
  - gpg
  - socat
  - conntrack

modulos_kernel:
  - overlay
  - br_netfilter

sysctl_params:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1

kubernetes_version: "1.34"

pacotes_kubernetes:
  - kubelet
  - kubeadm
  - kubectl

pod_network_cidr: "192.168.0.0/16"
