---
- name: Preparar todos os nós do cluster
  hosts: k8s_cluster
  become: true

  roles:
    - common
    - containerd
    - kubernetes

- name: Inicializar o Control Plane e instalar o Calico
  hosts: control_plane
  become: true

  roles:
    - control-plane

- name: Juntar os Workers ao cluster
  hosts: workers
  become: true

  roles:
    - worker

- name: Validar o cluster
  hosts: control_plane
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  tasks:
    - name: Esperar todos os nós ficarem Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=300s
      changed_when: false
      tags: [validacao]

    - name: Listar os nós
      ansible.builtin.command: kubectl get nodes -o wide
      register: kubectl_nodes
      changed_when: false
      tags: [validacao]

    - name: Mostrar os nós
      ansible.builtin.debug:
        var: kubectl_nodes.stdout_lines
      tags: [validacao]
