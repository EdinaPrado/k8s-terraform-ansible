---
- name: Inicializar o cluster com kubeadm init
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
    --apiserver-cert-extra-sans={{ ansible_host }}
    --node-name={{ inventory_hostname }}
  args:
    creates: /etc/kubernetes/admin.conf
  tags: [control-plane, kubeadm]

- name: Criar o diretório .kube do usuário
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: [control-plane, kubectl]

- name: Copiar o admin.conf para o ~/.kube/config do usuário
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  tags: [control-plane, kubectl]

- name: Verificar se o Calico já está instalado
  ansible.builtin.command: kubectl get daemonset calico-node -n kube-system
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_check
  failed_when: false
  changed_when: false
  tags: [control-plane, calico]

- name: Instalar o Calico
  ansible.builtin.command: >
    kubectl apply -f
    https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: calico_check.rc != 0
  tags: [control-plane, calico]
